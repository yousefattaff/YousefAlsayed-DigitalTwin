name: CI / Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend (Next.js 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Run frontend regressions
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Verify production release artifacts
        run: npm run release:check

  test-backend:
    name: Validate Backend (FastAPI & Lambda)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup locked dependency tooling
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python Dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Run backend regressions
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Compile & Validate Python Modules
        run: .venv/bin/python -m py_compile server.py lambda_handler.py deploy.py
