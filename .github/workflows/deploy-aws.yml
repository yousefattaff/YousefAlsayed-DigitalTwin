name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  PROJECT_NAME: twin

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set production API URL
        run: echo "NEXT_PUBLIC_API_URL=${{ secrets.API_GATEWAY_URL }}" > .env.production

      - name: Build static export
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"
          # HTML and JSON files get shorter cache
          aws s3 sync out/ s3://${{ secrets.S3_FRONTEND_BUCKET }}/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "*.json" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-backend:
    name: Package & Deploy Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Package Lambda
        run: |
          mkdir -p lambda-package
          uv pip install \
            --python-platform x86_64-unknown-linux-gnu \
            --python-version 3.12 \
            --target lambda-package \
            -r requirements.txt
          # Copy app files
          cp server.py lambda_handler.py context.py resources.py lambda-package/
          cp -r data lambda-package/
          # Create ZIP
          cd lambda-package && zip -r ../lambda-deployment.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.PROJECT_NAME }}-api \
            --zip-file fileb://lambda-deployment.zip

  health-check:
    name: Post-Deploy Health Check
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Check API health
        run: |
          RESPONSE=$(curl -sf "${{ secrets.API_GATEWAY_URL }}/health" || echo "FAILED")
          echo "API Health: $RESPONSE"
          if [ "$RESPONSE" = "FAILED" ]; then
            echo "⚠️ API health check failed!"
            exit 1
          fi

      - name: Check Frontend
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.CLOUDFRONT_URL }}" || echo "000")
          echo "Frontend Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Frontend health check failed!"
            exit 1
          fi
