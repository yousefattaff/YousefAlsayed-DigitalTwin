# Railway Backend Deployment
# Railway auto-detects Python + FastAPI and deploys from this config

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn server:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[services]]
name = "yousef-twin-api"
internalPort = 8000
