        <line x1="72" y1="93" x2="77" y2="91" stroke="#14161C" stroke-width="4" stroke-linecap="round" />
        <line x1="159" y1="91" x2="164" y2="93" stroke="#14161C" stroke-width="4" stroke-linecap="round" />
        <!-- Metallic Corner Rivets -->
        <circle cx="80" cy="90" r="1.4" fill="#F7F6F2" />
        <circle cx="156" cy="90" r="1.4" fill="#F7F6F2" />
        <!-- Crisp Diagonal Lens Glare Slash -->
        <line x1="85" y1="106" x2="93" y2="92" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
        <line x1="129" y1="106" x2="137" y2="92" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
