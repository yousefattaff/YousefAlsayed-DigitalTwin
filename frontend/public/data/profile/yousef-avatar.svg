      <path d="M99 123 Q101 126 103 128" fill="none" stroke="#B98564" stroke-width="2" stroke-linecap="round" />
      <path d="M137 123 Q135 126 133 128" fill="none" stroke="#B98564" stroke-width="2" stroke-linecap="round" />

