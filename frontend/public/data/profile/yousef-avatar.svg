        <path d="M68 100 Q64 105 69 111" fill="none" stroke="#B98564" stroke-width="2.5" stroke-linecap="round" />
        <ellipse cx="166" cy="105" rx="10" ry="14" fill="#E8B896" stroke="#1A1D24" stroke-width="4" />
        <path d="M168 100 Q172 105 167 111" fill="none" stroke="#B98564" stroke-width="2.5" stroke-linecap="round" />
