<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Yousef Alsayed character logo">
  <defs>
    <clipPath id="medallion-clip">
      <circle cx="118" cy="118" r="104" />
    </clipPath>
    <radialGradient id="royal-halo" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#5C7CFA" />
      <stop offset="65%" stop-color="#3B5BDB" />
      <stop offset="100%" stop-color="#2B44B8" />
    </radialGradient>
    <linearGradient id="lens-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52" />
      <stop offset="50%" stop-color="#74C0FC" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="tie-stripes" width="8" height="8" patternTransform="rotate(35)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#2B303C" />
      <rect width="3" height="8" fill="#3E4556" />
    </pattern>
  </defs>

  <g id="Yousef-Character-Logo">
