        <circle cx="96" cy="44" r="15" fill="#17161B" stroke="#14161C" stroke-width="3" />
        <circle cx="118" cy="40" r="16" fill="#17161B" stroke="#14161C" stroke-width="3" />
        <circle cx="140" cy="44" r="15" fill="#17161B" stroke="#14161C" stroke-width="3" />
        <circle cx="156" cy="58" r="13" fill="#17161B" stroke="#14161C" stroke-width="3" />
        <circle cx="72" cy="74" r="10" fill="#17161B" />
        <circle cx="164" cy="74" r="10" fill="#17161B" />

        <!-- Curl Highlight Arcs for Depth -->
        <path d="M89 43 Q96 36 104 42" fill="none" stroke="#353340" stroke-width="3" stroke-linecap="round" />
        <path d="M111 38 Q119 31 127 38" fill="none" stroke="#353340" stroke-width="3" stroke-linecap="round" />
        <path d="M134 42 Q142 36 148 44" fill="none" stroke="#353340" stroke-width="3" stroke-linecap="round" />
        <path d="M75 58 Q80 51 87 55" fill="none" stroke="#353340" stroke-width="2.5" stroke-linecap="round" />
        <path d="M150 55 Q157 51 161 58" fill="none" stroke="#353340" stroke-width="2.5" stroke-linecap="round" />
        <!-- Forehead Wave Details -->
        <path d="M86 58 Q95 65 105 57" fill="none" stroke="#14161C" stroke-width="3.5" stroke-linecap="round" />
        <path d="M114 56 Q124 63 134 56" fill="none" stroke="#14161C" stroke-width="3.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- Crisp Outer Medallion Ring Finish -->
    <circle cx="118" cy="118" r="104" fill="none" stroke="#1A1D24" stroke-width="5" />
  </g>
</svg>
