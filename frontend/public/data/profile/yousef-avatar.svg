      <!-- Textured Wavy / Curly Dark Hair (Layered Curls & Highlights) -->
      <g id="Curly-Hair">
        <path
          d="M69 92 C63 72 68 48 86 39 C96 33 108 31 119 31 C132 31 144 34 153 41 C169 51 173 72 167 92 C164 78 159 66 149 60 C139 54 128 53 118 53 C107 53 96 55 87 60 C77 66 72 78 69 92 Z"
