    <circle cx="124" cy="124" r="106" fill="#1A1D24" />
    <circle cx="118" cy="118" r="106" fill="url(#royal-halo)" stroke="#1A1D24" stroke-width="6" />

    <!-- Subtle inner ring & AI constellation nodes -->
    <circle cx="118" cy="118" r="95" fill="none" stroke="#74C0FC" stroke-opacity="0.38" stroke-width="1.75" stroke-dasharray="6 6" />
    <circle cx="42" cy="78" r="3.5" fill="#74C0FC" />
    <circle cx="194" cy="78" r="3.5" fill="#E8596A" />

    <!-- Clipped bust & portrait details -->
    <g clip-path="url(#medallion-clip)">
      <!-- Soft warm glow behind head -->
      <circle cx="118" cy="102" r="66" fill="#74C0FC" fill-opacity="0.16" />

      <!-- Tailored Suit Shoulders & Jacket (#1A1D24) -->
      <path
        d="M30 232 C34 178 66 158 118 158 C170 158 202 178 206 232 Z"
        fill="#1A1D24"
        stroke="#1A1D24"
        stroke-width="4"
        stroke-linejoin="round"
      />
      <!-- Suit Jacket Highlight Panels -->
      <path d="M36 230 C42 188 66 168 92 162 L82 230 Z" fill="#232733" />
      <path d="M200 230 C194 188 170 168 144 162 L154 230 Z" fill="#232733" />

      <!-- Crisp White Dress Shirt V-Front -->
      <path
        d="M90 148 L118 154 L146 148 L148 162 L118 228 L88 162 Z"
        fill="#F7F6F2"
        stroke="#1A1D24"
        stroke-width="3.5"
        stroke-linejoin="round"
      />

      <!-- Diagonal-Striped Tie (matching portrait) -->
      <path
        d="M112 167 L124 167 L129 228 L107 228 Z"
        fill="url(#tie-stripes)"
        stroke="#1A1D24"
        stroke-width="3"
        stroke-linejoin="round"
      />

      <!-- Notched Blazer Lapels -->
      <path
        d="M88 158 L70 176 L80 184 L73 194 L106 228 L96 170 Z"
        fill="#2B303C"
        stroke="#1A1D24"
        stroke-width="3.5"
        stroke-linejoin="round"
      />
      <path
        d="M148 158 L166 176 L156 184 L163 194 L130 228 L140 170 Z"
        fill="#2B303C"
        stroke="#1A1D24"
        stroke-width="3.5"
        stroke-linejoin="round"
      />
      <!-- Signature AI Lapel Pin -->
      <circle cx="151" cy="198" r="4" fill="#74C0FC" stroke="#1A1D24" stroke-width="2" />

      <!-- Neck & Under-Chin Shading -->
      <path
        d="M100 132 L100 150 Q118 158 136 150 L136 132 Z"
        fill="#E8B896"
        stroke="#1A1D24"
        stroke-width="3.5"
        stroke-linejoin="round"
