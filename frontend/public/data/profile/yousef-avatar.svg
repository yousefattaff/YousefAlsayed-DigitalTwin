<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Illustrated avatar of Yousef Alsayed">
  <!-- TikTok Royal Palette — Jet Black (#010101), Kinda White (#F4F5F8), Royal Blue (#2563EB), Electric Cyan (#25F4EE) & Pulse Red (#FE2C55) -->
  <g id="Avatar-Yousef-Brutalist">
    <!-- Dual TikTok-style offset shadow + Royal Blue circle background -->
    <circle cx="125" cy="125" r="108" fill="#FE2C55" />
    <circle cx="113" cy="113" r="108" fill="#25F4EE" />
    <circle cx="118" cy="118" r="108" fill="#2563EB" stroke="#010101" stroke-width="6" />

    <!-- Jet Black Hoodie (#010101) with Off-White (#F4F5F8) collar -->
    <path d="M42 214 C48 168 78 154 118 154 C158 154 188 168 194 214 Z" fill="#010101" stroke="#010101" stroke-width="5" stroke-linejoin="round" />
    <path d="M92 155 Q118 174 144 155" fill="#F4F5F8" stroke="#010101" stroke-width="4" />
    <text x="118" y="198" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Inter, sans-serif" font-weight="800" font-size="16" letter-spacing="2">Y.AI</text>

    <!-- Neck -->
    <rect x="103" y="130" width="30" height="30" rx="10" fill="#F8D9CB" stroke="#000000" stroke-width="4" />

    <!-- Ears -->
    <circle cx="71" cy="108" r="12" fill="#F8D9CB" stroke="#000000" stroke-width="4" />
    <circle cx="165" cy="108" r="12" fill="#F8D9CB" stroke="#000000" stroke-width="4" />

    <!-- Head -->
    <rect x="74" y="60" width="88" height="90" rx="40" fill="#F8D9CB" stroke="#000000" stroke-width="5" />

    <!-- Curly dark hair cap (#18191F) -->
    <path d="M68 88 C64 56 88 40 118 40 C148 40 172 56 168 88 C160 72 142 66 118 66 C94 66 76 72 68 88 Z" fill="#18191F" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <circle cx="88" cy="52" r="14" fill="#18191F" />
    <circle cx="114" cy="46" r="16" fill="#18191F" />
    <circle cx="140" cy="50" r="15" fill="#18191F" />
    <circle cx="156" cy="64" r="12" fill="#18191F" />
    <circle cx="76" cy="66" r="12" fill="#18191F" />

    <!-- Round wireframe glasses like the Figma reference -->
    <circle cx="98" cy="104" r="15" fill="#FFFFFF" fill-opacity="0.35" stroke="#000000" stroke-width="4" />
    <circle cx="138" cy="104" r="15" fill="#FFFFFF" fill-opacity="0.35" stroke="#000000" stroke-width="4" />
    <line x1="113" y1="104" x2="123" y2="104" stroke="#000000" stroke-width="4" />
    <line x1="74" y1="102" x2="83" y2="104" stroke="#000000" stroke-width="4" />
    <line x1="153" y1="104" x2="162" y2="102" stroke="#000000" stroke-width="4" />

    <!-- Eyes -->
    <circle cx="98" cy="104" r="4" fill="#000000" />
    <circle cx="138" cy="104" r="4" fill="#000000" />

    <!-- Eyebrows -->
    <path d="M85 84 Q98 78 110 84" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    <path d="M126 84 Q138 78 151 84" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />

    <!-- Nose & Smile -->
    <path d="M118 106 L115 118 L122 118" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M105 128 Q118 137 131 128" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
