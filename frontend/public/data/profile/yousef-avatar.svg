      <path d="M84 66 Q118 56 152 66" fill="none" stroke="#F9DEC9" stroke-width="5" stroke-linecap="round" opacity="0.65" />
      <ellipse cx="89" cy="116" rx="9" ry="5" fill="#E59885" opacity="0.38" />
      <ellipse cx="147" cy="116" rx="9" ry="5" fill="#E59885" opacity="0.38" />

